upstream gateway {
    server api-gateway:4000;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.internnova.com;
    return 301 https://$server_name$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.internnova.com;

    # SSL certificates (managed by certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.internnova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.internnova.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (matches Spring Boot multipart config and gateway body limit: 25MB)
    client_max_body_size 25m;

    # Proxy all traffic to the API Gateway
    location / {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Timeouts — AI pipeline evaluation can take up to ~90s
        # (PDF download + text extraction + LLM shortlisting + scoring)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Disable buffering for long-running AI requests so the client
        # doesn't time out waiting for a response to start
        proxy_buffering off;

        # CORS preflight — handled at Nginx level to reduce gateway load
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-Id" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age "3600" always;
            return 204;
        }
    }

    # Health check endpoint — no access logging to reduce noise
    location /health {
        proxy_pass http://gateway/health;
        access_log off;
    }
}
