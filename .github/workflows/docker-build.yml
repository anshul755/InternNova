name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'api-gateway/**'
      - 'auth-service/**'
      - 'core-service/**'
      - 'ai-service/**'
      - 'docker-compose.yml'
      - 'nginx/**'
      - '.github/workflows/docker-build.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api-gateway
            context: ./api-gateway
            dockerfile: ./api-gateway/Dockerfile
          - name: auth-service
            context: ./auth-service
            dockerfile: ./auth-service/Dockerfile
          - name: core-service
            context: ./core-service
            dockerfile: ./core-service/Dockerfile
          - name: ai-service
            context: ./ai-service
            dockerfile: ./ai-service/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.service.name }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed image
        run: |
          echo "Pushed tags: ${{ steps.meta.outputs.tags }}"
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}:latest
