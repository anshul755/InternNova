<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/internNova-dark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="InternNova — AI-powered internship matching platform. Find your dream internship or discover top early talent, faster."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>
      (() => {
        const storageKey = "internnova-theme";
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;

        let theme = prefersDark ? "dark" : "light";

        try {
          const stored = window.localStorage.getItem(storageKey);
          if (stored === "light" || stored === "dark") {
            theme = stored;
          } else if (stored === "system") {
            theme = prefersDark ? "dark" : "light";
          }
        } catch {
          // Ignore storage errors and fall back to the system theme.
        }

        const root = document.documentElement;
        root.dataset.theme = theme;
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;

        let meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) {
          meta = document.createElement("meta");
          meta.setAttribute("name", "theme-color");
          document.head.appendChild(meta);
        }
        if (meta) {
          meta.setAttribute(
            "content",
            theme === "dark" ? "#07120c" : "#eef5eb",
          );
        }
      })();
    </script>
    <title>InternNova</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
