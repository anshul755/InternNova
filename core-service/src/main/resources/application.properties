spring.application.name=InternNova
server.port=${SERVER_PORT:8080}

# ── MongoDB ───────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/internnova-dev}
spring.data.mongodb.database=${MONGODB_DB_NAME:internnova-dev}

# ── Cloudinary ────────────────────────────────────────────────────────────────
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:dev}
cloudinary.api_key=${CLOUDINARY_API_KEY:dev}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:dev}

# ── File Uploads ──────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# ── AI pipeline service ───────────────────────────────────────────────────────
ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000}

# ── JWT (shared secret with auth-service) ─────────────────────────────────────
jwt.access-secret=${JWT_ACCESS_SECRET:dev-secret-change-in-production-min-32-chars}

# ── Internal service-to-service token ─────────────────────────────────────────
service.internal-token=${INTERNAL_SERVICE_TOKEN:dev-internal-token}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5001}

# Mail notifications
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${EMAIL_FROM:InternNova <no-reply@internnova.com>}
app.mail.force-configured-from=${MAIL_FORCE_CONFIGURED_FROM:false}
