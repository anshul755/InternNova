spring.application.name=InternNova
server.port=${SERVER_PORT:8080}

# ── MongoDB ───────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DB_NAME:internnova-prod}

# ── Cloudinary ────────────────────────────────────────────────────────────────
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# ── File Uploads ──────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ── AI pipeline service ───────────────────────────────────────────────────────
ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000}

# ── JWT (shared secret with auth-service) ─────────────────────────────────────
jwt.access-secret=${JWT_ACCESS_SECRET:change_me_to_a_very_long_random_secret_at_least_32_chars}

# ── Internal service-to-service token ─────────────────────────────────────────
service.internal-token=${INTERNAL_SERVICE_TOKEN:dev-internal-token}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5001}
